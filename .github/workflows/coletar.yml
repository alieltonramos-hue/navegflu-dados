name: coletar

# A Marinha publica a altura do rio entre 06:45 e 08:30 (Cuiaba, UTC-4, sem horario de verao)
# e depois nao publica mais nada. Os crons abaixo estao em UTC (= hora local + 4).
# O cron do GitHub pode atrasar de 5 a 20 minutos e pode pular a hora cheia: por isso os
# minutos sao quebrados (nao 00/15/30/45), para nao cair junto com a fila das horas cheias.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 10 * * *"           # 06:47 local
    - cron: "2,17,32,47 11 * * *"   # 07:02, 07:17, 07:32 e 07:47 local
    - cron: "2,17,32,47 12 * * *"   # 08:02, 08:17, 08:32 e 08:47 local (folga apos as 08:30)
    - cron: "7 16,22 * * *"         # 12:07 e 18:07 local: DMH-PY e AVURNAV

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 (com cache do pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Testes do coletor (sem rede; falha aqui impede a publicacao)
        run: python -m unittest discover -s testes -v

      - name: Coletar fontes oficiais
        id: coleta
        # Sai com 0 se ao menos uma fonte respondeu (o log mostra cada uma). Sai com 1 se todas falharam.
        run: python coletor.py hidro.json

      - name: Ver se a coleta deu certo e se os dados mudaram
        id: mudanca
        # Commita sempre que ao menos uma fonte respondeu nesta rodada, para o app ver a hora da
        # ultima verificacao (verificado_em_utc). gerado_em_utc muda so quando algum dado mudou.
        run: |
          python -I - <<'PY'
          import json, os, subprocess
          novo = json.load(open("hidro.json", encoding="utf-8"))
          antigo_txt = subprocess.run(["git", "show", "HEAD:hidro.json"],
                                      capture_output=True, text=True).stdout
          antigo = json.loads(antigo_txt) if antigo_txt else {}
          coleta_ok = any(f.get("ok") for f in novo.get("fontes", {}).values())
          dados_mudaram = novo.get("gerado_em_utc") != antigo.get("gerado_em_utc")
          hora = novo["verificado_em_utc"][:16] + "Z"          # AAAA-MM-DDTHH:MMZ
          mensagem = f"Dados: coleta {hora}" if dados_mudaram else f"Dados: verificação {hora}"
          print("[*] coleta com fonte OK: " + ("sim, vai commitar" if coleta_ok else "nao, nada a commitar"))
          print("[*] dados mudaram: " + ("sim" if dados_mudaram else "nao (so a hora da verificacao)"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"coleta_ok={'true' if coleta_ok else 'false'}\n")
              f.write(f"mensagem={mensagem}\n")
          PY

      - name: Commitar e enviar hidro.json
        if: steps.mudanca.outputs.coleta_ok == 'true'
        env:
          MENSAGEM: ${{ steps.mudanca.outputs.mensagem }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hidro.json
          git commit -m "$MENSAGEM"
          git push
